[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rag"
version = "0.2.0"
description = "RAG multi-máquina: ingestión local de PDFs (0 tokens) y diagnóstico filtrado por metadatos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "qdrant-client>=1.12.0",
  "fastembed>=0.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
industrial-rag = "industrial_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
