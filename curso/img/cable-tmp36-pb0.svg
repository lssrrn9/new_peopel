<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>TMP36 en PB0 (A3), si usas ese sensor</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">TMP36 en PB0 (A3), si usas ese sensor</text>
<text x="24" y="54" font-size="12" fill="#57534e">La fórmula es la de la hoja Analog Devices del TMP36. Confírmala en tu revisión.</text>
<rect x="24" y="88" width="460" height="102" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN8 pin 4 · PB0 / A3 → salida Vout del TMP36</text><text x="40" y="158" font-size="13">CN6 pin 4 · +3,3 V → Vs del TMP36</text><text x="40" y="180" font-size="13">CN6 pin 6 · GND → GND del TMP36</text><rect x="560" y="88" width="500" height="116" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">TMP36</text><text x="576" y="134" font-size="13">Vs entre 2,7 V y 5,5 V según su hoja: aquí 3,3 V.</text><text x="576" y="154" font-size="13">Vout ≈ 750 mV a 25 °C, 10 mV/°C.</text><text x="576" y="174" font-size="13">T (°C) = (Vout_mV − 750) / 10.</text><text x="576" y="194" font-size="13">100 nF entre Vs y GND, junto al sensor.</text><text x="24" y="248" font-size="13">Si usas otro sensor, no apliques esta fórmula.</text><text x="24" y="270" font-size="13">PB0 es TTa: la salida del sensor tiene que caber en 0 a 3,3 V.</text></svg>
