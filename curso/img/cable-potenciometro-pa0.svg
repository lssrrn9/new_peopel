<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>Potenciómetro en PA0 (A0)</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">Potenciómetro en PA0 (A0)</text>
<text x="24" y="54" font-size="12" fill="#57534e">UM1724 Tabla 14: CN8 pin 1 = A0 = PA0, ADC1_IN1, pin TTa.</text>
<rect x="24" y="88" width="460" height="102" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN8 pin 1 · PA0 / A0 → cursor del potenciómetro</text><text x="40" y="158" font-size="13">CN6 pin 4 · +3,3 V → un extremo del potenciómetro</text><text x="40" y="180" font-size="13">CN6 pin 6 · GND → el otro extremo</text><rect x="560" y="88" width="500" height="96" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">Potenciómetro 10 kΩ lineal</text><text x="576" y="134" font-size="13">Solo entre 0 y 3,3 V.</text><text x="576" y="154" font-size="13">No lo alimentes a 5 V.</text><text x="576" y="174" font-size="13">PA0 no es tolerante a 5 V.</text><text x="24" y="228" font-size="13">Giro a un extremo: cerca de 0 V. Al otro: cerca de 3,3 V.</text><text x="24" y="250" font-size="13">El código convierte el número de 12 bits con Vref = VDDA ≈ 3,3 V.</text></svg>
