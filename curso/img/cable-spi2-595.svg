<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>74HC595 a 3,3 V por SPI2</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">74HC595 a 3,3 V por SPI2</text>
<text x="24" y="54" font-size="12" fill="#57534e">SPI2 en el Morpho CN10, para no usar PA5. Datasheet, AF5.</text>
<rect x="24" y="88" width="460" height="146" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN10 pin 30 · PB13 SCK → SRCLK (reloj) del 595</text><text x="40" y="158" font-size="13">CN10 pin 26 · PB15 MOSI → SER (dato) del 595</text><text x="40" y="180" font-size="13">CN10 pin 16 · PB12 NSS → RCLK (latch)</text><text x="40" y="202" font-size="13">CN6 pin 4 · +3,3 V → VCC del 595</text><text x="40" y="224" font-size="13">CN6 pin 6 · GND → GND y OE a GND, MR a 3,3 V</text><rect x="560" y="88" width="500" height="96" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">74HC595 y LED</text><text x="576" y="134" font-size="13">Alimentado a 3,3 V, no a 5 V.</text><text x="576" y="154" font-size="13">Cada salida Q lleva su resistencia y su LED a GND.</text><text x="576" y="174" font-size="13">MISO (PB14, CN10 pin 28) no hace falta para este integrado.</text><text x="24" y="262" font-size="13">PA5 sigue siendo el LED verde de la placa.</text><text x="24" y="284" font-size="13">Confirma los nombres SER, SRCLK y RCLK en la hoja del 595 que compres.</text></svg>
