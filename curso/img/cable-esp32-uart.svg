<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>USART1 hacia un ESP32 a 3,3 V</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">USART1 hacia un ESP32 a 3,3 V</text>
<text x="24" y="54" font-size="12" fill="#57534e">UM1724: D8 = PA9 = USART1_TX, D2 = PA10 = USART1_RX. Los dos son FT/FTf.</text>
<rect x="24" y="88" width="460" height="102" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN5 pin 1 · PA9 / D8 TX → RX del ESP32</text><text x="40" y="158" font-size="13">CN9 pin 3 · PA10 / D2 RX → TX del ESP32</text><text x="40" y="180" font-size="13">CN6 pin 7 · GND → GND del ESP32</text><rect x="560" y="88" width="500" height="116" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">ESP32</text><text x="576" y="134" font-size="13">Aliméntalo por su propio USB.</text><text x="576" y="154" font-size="13">UART a 3,3 V, no el pin de 5 V.</text><text x="576" y="174" font-size="13">TX del uno va al RX del otro.</text><text x="576" y="194" font-size="13">GND común obligatorio.</text><text x="24" y="248" font-size="13">La salida del STM32 es 3,3 V aunque el pin tolere 5 V en la entrada.</text><text x="24" y="270" font-size="13">USART2 (PA2/PA3) se queda para el puerto virtual del ST-LINK.</text></svg>
