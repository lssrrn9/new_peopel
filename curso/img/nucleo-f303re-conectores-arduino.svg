<text x="24" y="962" class="xs" text-anchor="start">A4 y A5: SB56 y SB51 están cerrados de fábrica, así que llegan PC1 y PC0. PB9 y PB8 están en D14 y D15.</text>
<text x="24" y="982" class="xs" text-anchor="start">D0 y D1 aparecen en la serigrafía, pero SB62 y SB63 están abiertos: la pista no llega al MCU.</text>
<text x="24" y="1002" class="xs" text-anchor="start">PA0, PA1, PA4, PB0, PC0 y PC1 son TTa: la entrada analógica no admite 5 V (datasheet, Tabla 19).</text>
