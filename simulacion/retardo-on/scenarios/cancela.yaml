name: Retardo cancelado si la entrada cae antes
version: 1
author: casa

steps:
  - wait-serial: 'Listo'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'Entrada ON. Retardo 10 s'
  - delay: 3000ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: 'Entrada OFF. Retardo cancelado'
  - delay: 8000ms
  - expect-pin:
      part-id: esp
      pin: D4
      expected: 0
