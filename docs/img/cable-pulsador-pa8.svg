<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>Pulsador externo en PA8 (D7)</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">Pulsador externo en PA8 (D7)</text>
<text x="24" y="54" font-size="12" fill="#57534e">UM1724 Tabla 14: CN9 pin 8 = D7 = PA8.</text>
<rect x="24" y="88" width="460" height="102" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN9 pin 8 · PA8 / D7 → pulsador y condensador</text><text x="40" y="158" font-size="13">CN6 pin 4 · +3,3 V → resistencia 4,7 kΩ</text><text x="40" y="180" font-size="13">CN6 pin 7 · GND → otro extremo del pulsador</text><rect x="560" y="88" width="500" height="116" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">Red del pulsador</text><text x="576" y="134" font-size="13">4,7 kΩ de +3,3 V a PA8.</text><text x="576" y="154" font-size="13">100 nF de PA8 a GND.</text><text x="576" y="174" font-size="13">Pulsador entre PA8 y GND.</text><text x="576" y="194" font-size="13">En reposo el pin está a 3,3 V. Pulsado, a 0 V.</text><text x="24" y="248" font-size="13">No alimentes el pulsador con 5 V: PA8 se queda en la red de 3,3 V.</text><text x="24" y="270" font-size="13">El pulsador azul de la placa sigue siendo PC13 y no se cablea aquí.</text></svg>
