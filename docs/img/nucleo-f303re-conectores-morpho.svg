<text x="24" y="940" class="xs" text-anchor="start">Filas en rojo: PA13/PA14 son el depurador. PA2 y PA3 figuran en la tabla pero el puente de fábrica los deja abiertos (SB62, SB63).</text>
<text x="24" y="960" class="xs" text-anchor="start">CN7 pin 36 es PC1 por defecto (A4). CN7 pin 38 es PC0 por defecto (A5). Cambian a PB9/PB8 solo si se modifican SB46, SB52, SB56 y SB51.</text>
