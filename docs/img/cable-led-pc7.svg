<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>LED externo en PC7 (D9)</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">LED externo en PC7 (D9)</text>
<text x="24" y="54" font-size="12" fill="#57534e">UM1724 Tabla 14: CN5 pin 2 = D9 = PC7. Corriente limitada por R, calculada en el módulo 2.</text>
<rect x="24" y="88" width="460" height="80" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN5 pin 2 · PC7 / D9 → resistencia del LED</text><text x="40" y="158" font-size="13">CN6 pin 6 · GND → cátodo del LED</text><rect x="560" y="88" width="500" height="116" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">LED indicador</text><text x="576" y="134" font-size="13">Ánodo hacia la resistencia.</text><text x="576" y="154" font-size="13">Cátodo (pata corta, lado plano) a GND.</text><text x="576" y="174" font-size="13">R = (3,3 V − Vf) / If, If ≤ 8 mA.</text><text x="576" y="194" font-size="13">No usar PC13 para este LED.</text><text x="24" y="248" font-size="13">Tierra común: GND de CN6. Alimentación del LED: el propio pin, no 5 V.</text><text x="24" y="270" font-size="13">PC7 es FT (datasheet, tabla 13). La salida sigue siendo de 3,3 V.</text></svg>
