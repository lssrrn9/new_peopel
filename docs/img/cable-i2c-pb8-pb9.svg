<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>I2C1 en D15 y D14</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }</style>
<text x="24" y="32" font-size="20" font-weight="700">I2C1 en D15 y D14</text>
<text x="24" y="54" font-size="12" fill="#57534e">UM1724: D15 = PB8 = SCL, D14 = PB9 = SDA. No son A4 ni A5 de fábrica.</text>
<rect x="24" y="88" width="460" height="124" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><text x="40" y="112" font-size="14" font-weight="700" fill="#1e3a5f">NUCLEO-F303RE · USB arriba</text><text x="40" y="136" font-size="13">CN5 pin 10 · PB8 / D15 SCL → SCL del módulo</text><text x="40" y="158" font-size="13">CN5 pin 9 · PB9 / D14 SDA → SDA del módulo</text><text x="40" y="180" font-size="13">CN6 pin 4 · +3,3 V → VCC del módulo</text><text x="40" y="202" font-size="13">CN6 pin 6 · GND → GND del módulo</text><rect x="560" y="88" width="500" height="96" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="576" y="112" font-size="14" font-weight="700" fill="#c2410c">Módulo I2C a 3,3 V</text><text x="576" y="134" font-size="13">Pull-up 4,7 kΩ a 3,3 V en SCL y SDA si el módulo no los trae.</text><text x="576" y="154" font-size="13">No alimentes un módulo de solo 5 V.</text><text x="576" y="174" font-size="13">La dirección de 7 bits se lee en la serigrafía o en la hoja.</text><text x="24" y="240" font-size="13">PB8 y PB9 no se usan a la vez como CAN.</text><text x="24" y="262" font-size="13">A4 y A5 siguen siendo PC1 y PC0.</text></svg>
