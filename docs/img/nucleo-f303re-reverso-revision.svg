<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img">
<title>Cómo identificar la revisión de la placa</title>
<rect width="100%" height="100%" fill="#f6f3ee"/>
<style>
  text { font-family: Liberation Sans, Segoe UI, sans-serif; fill: #1c1917; }
  .h { font-size: 22px; font-weight: 700; }
  .sub { font-size: 12px; fill: #57534e; }
  .sm { font-size: 11px; }
  .xs { font-size: 10px; }
  .tiny { font-size: 9px; }
  .w { fill: #fff; }
  .pin { font-size: 9px; font-family: Liberation Sans, Segoe UI, sans-serif; }
</style>
<text x="24" y="34" class="h" text-anchor="start">Cómo saber qué revisión tienes en la mano</text>
<text x="24" y="56" class="sub" text-anchor="start">UM1724 Rev 17, §8.1 y Tabla 35. La etiqueta está en la cara de abajo.</text>
<rect x="40" y="90" width="420" height="260" rx="8" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="60" y="120" class="sm" text-anchor="start">Etiqueta, ejemplo de lectura</text>
<rect x="70" y="145" width="360" height="160" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/>
<text x="90" y="180" class="h" text-anchor="start">NUCLEO-F303RE</text>
<text x="90" y="210" class="sm" text-anchor="start">MB1136-F303RE-C05</text>
<text x="90" y="236" class="sm" text-anchor="start">syywwxxxxx</text>
<text x="90" y="270" class="xs" text-anchor="start">MB1136 = PCB    F303RE = montaje</text>
<text x="90" y="288" class="xs" text-anchor="start">C = revisión del circuito    05 = ensamblado</text>
<rect x="500" y="90" width="460" height="260" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<text x="520" y="120" class="sm" text-anchor="start">Qué cambia y qué no</text>
<text x="520" y="150" class="xs" text-anchor="start">C-01: sin cristal de 32 kHz y sin MCO.</text>
<text x="520" y="178" class="xs" text-anchor="start">C-02: entra X2 32,768 kHz y el MCO de 8 MHz.</text>
<text x="520" y="206" class="xs" text-anchor="start">C-03: otro cristal ABS25 y condensadores nuevos.</text>
<text x="520" y="234" class="xs" text-anchor="start">C-04: cambia el transistor T2 de potencia.</text>
<text x="520" y="262" class="xs" text-anchor="start">C-05: cambia CN1, B1 y B2. Sigue siendo Mini-B</text>
<text x="520" y="290" class="xs" text-anchor="start">en el esquema C05 (5075BMR-05-SM).</text>
<rect x="40" y="380" width="920" height="300" rx="8" fill="#fff" stroke="#a8a29e" stroke-width="1.2"/>
<text x="60" y="412" class="sm" text-anchor="start">Puentes que debes conocer antes de cablear</text>
<text x="60" y="440" class="xs" text-anchor="start">SB13, SB14</text>
<text x="200" y="440" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="440" class="xs" text-anchor="start">PA2/PA3 unidos al ST-LINK (puerto virtual)</text>
<text x="60" y="464" class="xs" text-anchor="start">SB62, SB63</text>
<text x="200" y="464" class="xs" text-anchor="start" fill="#991b1b">OFF</text>
<text x="280" y="464" class="xs" text-anchor="start">PA2/PA3 NO llegan a D1/D0 ni al Morpho</text>
<text x="60" y="488" class="xs" text-anchor="start">SB21</text>
<text x="200" y="488" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="488" class="xs" text-anchor="start">LD2 verde unido a PA5 / D13</text>
<text x="60" y="512" class="xs" text-anchor="start">SB17</text>
<text x="200" y="512" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="512" class="xs" text-anchor="start">Pulsador B1 unido a PC13</text>
<text x="60" y="536" class="xs" text-anchor="start">SB56, SB51</text>
<text x="200" y="536" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="536" class="xs" text-anchor="start">A4 = PC1 y A5 = PC0</text>
<text x="60" y="560" class="xs" text-anchor="start">SB46, SB52</text>
<text x="200" y="560" class="xs" text-anchor="start" fill="#991b1b">OFF</text>
<text x="280" y="560" class="xs" text-anchor="start">PB8/PB9 no están duplicados en A5/A4</text>
<text x="60" y="584" class="xs" text-anchor="start">SB16, SB50</text>
<text x="200" y="584" class="xs" text-anchor="start" fill="#166534">ON*</text>
<text x="280" y="584" class="xs" text-anchor="start">MCO 8 MHz a PF0, desde la revisión C-02</text>
<text x="60" y="608" class="xs" text-anchor="start">SB2</text>
<text x="200" y="608" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="608" class="xs" text-anchor="start">La salida de 3,3 V del LDO llega a VDD</text>
<text x="60" y="632" class="xs" text-anchor="start">SB45, SB57</text>
<text x="200" y="632" class="xs" text-anchor="start" fill="#166534">ON</text>
<text x="280" y="632" class="xs" text-anchor="start">VBAT y VDDA unidos a VDD</text>
</svg>
